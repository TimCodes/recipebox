openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Recipe management
  - name: mealPlan
    description: Weekly meal plan entries
  - name: groceryList
    description: Grocery list items
  - name: dashboard
    description: Home dashboard summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List / search recipes
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive match against title, tags, and ingredient names
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: Filter to recipes containing this exact tag
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/ingest:
    post:
      operationId: ingestRecipes
      tags: [recipes]
      summary: Extract structured recipe(s) from pasted text or an uploaded PDF
      description: >
        Runs text extraction (for PDFs) and AI-assisted structured parsing to turn
        free-form recipe text into one or more recipe drafts. Drafts are NOT
        persisted — the client must review/edit and then POST each one to
        /recipes to actually save it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRecipesInput"
      responses:
        "200":
          description: Extracted recipe draft(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestRecipesResult"
        "400":
          description: Invalid request (bad input shape, unreadable PDF, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Content was readable but no recipe could be extracted from it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipes/{id}/nutrition:
    post:
      operationId: estimateRecipeNutrition
      tags: [recipes]
      summary: Estimate per-serving nutrition for a recipe from its ingredients
      description: >
        Derives per-serving macros for a recipe whose source never stated them. Deliberately a
        separate, explicit call rather than something that happens on save: it costs money, so
        it should be something the user asks for and can repeat, not a hidden charge on every
        edit.

        The model is asked only for a gram weight and a per-100g composition per ingredient;
        all summing and the per-serving division happen server-side. Models are unreliable at
        multi-step arithmetic, and a wrong total looks exactly like a right one.

        Overwrites any previous derived value. Refuses to overwrite a `manual` correction
        unless `force` is set.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateNutritionInput"
      responses:
        "200":
          description: The recipe, with freshly estimated nutrition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The recipe has a manual correction and `force` was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            No usable estimate could be produced — the recipe has no servings, or the result
            failed the plausibility checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI features are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipes/pdf-outline:
    post:
      operationId: outlineRecipePdf
      tags: [recipes]
      summary: List the recipes found in a PDF, without calling any AI
      description: >
        Extracts the PDF's text locally and locates recipe boundaries and titles with
        heuristics only — no model call, no tokens, no cost. The client shows the result so
        the user can pick which recipes to extract, and then passes those page numbers to
        /recipes/ingest. For the common case of taking a few recipes out of a large cookbook
        this avoids sending (and paying for) the entire book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfOutlineInput"
      responses:
        "200":
          description: Recipes located in the document. `candidates` may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfOutlineResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The PDF had no extractable text (e.g. a scan with no text layer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipes/generate:
    post:
      operationId: generateRecipe
      tags: [recipes]
      summary: Generate a new recipe with AI, grounded in the user's own collection
      description: >
        Retrieves recipes from the user's collection relevant to the prompt, then asks an
        AI model to generate a new recipe grounded in that context. Returned as an
        editable draft — the client must review/edit and then POST it to /recipes to save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRecipeInput"
      responses:
        "200":
          description: Generated recipe draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedRecipeResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The AI could not produce a usable recipe from the given prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipes/tags:
    get:
      operationId: listRecipeTags
      tags: [recipes]
      summary: List distinct tags across all recipes
      responses:
        "200":
          description: Distinct tag list
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a recipe by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRecipe
      tags: [recipes]
      summary: Update a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /meal-plan:
    get:
      operationId: listMealPlanEntries
      tags: [mealPlan]
      summary: List meal plan entries in a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Meal plan entries in range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealPlanEntry"
    post:
      operationId: createMealPlanEntry
      tags: [mealPlan]
      summary: Assign a recipe to a day/slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"
        "404":
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /meal-plan/generate:
    post:
      operationId: generateMealPlan
      tags: [mealPlan]
      summary: Propose a full week of meal assignments with AI, grounded in the user's own recipes
      description: >
        For each requested meal slot in the target week that isn't already planned, proposes
        either an existing recipe from the user's collection or a newly generated recipe to
        fill the gap. Returned as an editable draft — nothing is saved until the client
        creates any new recipes via /recipes and then assigns them via /meal-plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMealPlanInput"
      responses:
        "200":
          description: Generated meal plan draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedMealPlanResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The AI could not produce a usable meal plan from the given prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /meal-plan/{id}:
    patch:
      operationId: updateMealPlanEntry
      tags: [mealPlan]
      summary: Update a meal plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMealPlanEntry
      tags: [mealPlan]
      summary: Remove a meal plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grocery-list:
    get:
      operationId: listGroceryListItems
      tags: [groceryList]
      summary: List grocery list items for a week
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date }
          description: Monday date (YYYY-MM-DD) identifying the week
      responses:
        "200":
          description: Grocery list items for the week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroceryListItem"
    post:
      operationId: createGroceryListItem
      tags: [groceryList]
      summary: Manually add a grocery list item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroceryListItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryListItem"
    delete:
      operationId: clearGroceryList
      tags: [groceryList]
      summary: Remove every grocery list item for a week
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date }
          description: Monday date (YYYY-MM-DD) identifying the week
      responses:
        "204":
          description: Cleared

  /grocery-list/generate:
    post:
      operationId: generateGroceryList
      tags: [groceryList]
      summary: (Re)generate the auto grocery list from a week's meal plan
      description: >
        Aggregates ingredients from all recipes assigned in the given week into
        categorized auto-generated items, preserving checked state where the
        same item persists and removing stale auto items no longer needed.
        Manually added items are left untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateGroceryListInput"
      responses:
        "200":
          description: Full grocery list for the week after regeneration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroceryListItem"

  /grocery-list/{id}:
    patch:
      operationId: updateGroceryListItem
      tags: [groceryList]
      summary: Update a grocery list item (e.g. toggle checked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroceryListItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryListItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGroceryListItem
      tags: [groceryList]
      summary: Remove a grocery list item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Home dashboard summary for a given week
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    IngredientCategory:
      type: string
      enum:
        - produce
        - dairy
        - meat_seafood
        - bakery
        - pantry
        - frozen
        - beverages
        - spices
        - other

    MealSlot:
      type: string
      enum: [breakfast, lunch, dinner, snack]

    NutritionSource:
      type: string
      enum: [stated, estimated, computed, manual]
      description: >
        Where the numbers came from. `stated` means the source document printed them (a
        cookbook's "PER SERVING" panel) — the most trustworthy case, since it reflects the
        recipe as actually tested. `estimated` and `computed` are derived by us. `manual` is a
        user correction and must never be overwritten automatically. This is surfaced in the
        UI, so a tested panel is never presented as though it were our guess.

    NutritionInput:
      type: object
      description: Per-serving macros. All values may be null when unknown; never guess to fill them in.
      required: [calories, proteinG, carbsG, fatG, source]
      properties:
        calories: { type: ["integer", "null"], description: kcal per serving }
        proteinG: { type: ["number", "null"] }
        carbsG: { type: ["number", "null"] }
        fatG: { type: ["number", "null"] }
        source:
          $ref: "#/components/schemas/NutritionSource"
        extras:
          type: ["object", "null"]
          additionalProperties: true
          description: >
            Anything beyond the four macros that the source happened to provide — fiber,
            sugars, saturated fat, cholesterol, sodium. Kept because it costs nothing to
            retain and is otherwise discarded permanently.

    EstimateNutritionInput:
      type: object
      properties:
        force:
          type: boolean
          description: >
            Replace a manual correction. Without it a hand-edited value is preserved, because
            silently overwriting someone's correction with a machine estimate is worse than
            refusing.

    NutritionIngredientBreakdown:
      type: object
      description: >
        What the estimate assumed for one ingredient. Stored so a surprising total can be
        explained — "why is this 900 calories?" is answerable with "it assumed 200g of olive
        oil" — and so a bad assumption is visible rather than buried in a single number.
      required: [name, grams, calories, proteinG, carbsG, fatG]
      properties:
        name: { type: string, description: The ingredient as the estimator understood it. }
        grams: { type: ["number", "null"], description: Assumed weight for the stated quantity. }
        calories: { type: ["number", "null"] }
        proteinG: { type: ["number", "null"] }
        carbsG: { type: ["number", "null"] }
        fatG: { type: ["number", "null"] }
        note: { type: ["string", "null"], description: Optional caveat, e.g. "assumed drained weight". }

    Nutrition:
      allOf:
        - $ref: "#/components/schemas/NutritionInput"
        - type: object
          required: [stale, updatedAt]
          properties:
            stale:
              type: boolean
              description: >
                True when the recipe's ingredients or servings have changed since these
                numbers were recorded, so they no longer describe the current recipe. Computed
                on read by comparing a hash of the inputs — never a stored flag, which would
                have to be maintained by every write path and would eventually be wrong.
            updatedAt: { type: ["string", "null"], format: date-time }
            breakdown:
              type: ["array", "null"]
              items:
                $ref: "#/components/schemas/NutritionIngredientBreakdown"
              description: Present for derived values; absent when the source stated them directly.

    Ingredient:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1 }
        quantity: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        category:
          $ref: "#/components/schemas/IngredientCategory"

    Recipe:
      type: object
      required:
        - id
        - title
        - description
        - ingredients
        - instructions
        - servings
        - prepMinutes
        - cookMinutes
        - tags
        - photoUrl
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions: { type: string }
        servings: { type: ["integer", "null"] }
        prepMinutes: { type: ["integer", "null"] }
        cookMinutes: { type: ["integer", "null"] }
        tags:
          type: array
          items: { type: string }
        photoUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nutrition:
          oneOf:
            - $ref: "#/components/schemas/Nutrition"
            - type: "null"

    RecipeInput:
      type: object
      required: [title, ingredients, instructions]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions: { type: string, minLength: 1 }
        servings: { type: integer, minimum: 1 }
        prepMinutes: { type: integer, minimum: 0 }
        cookMinutes: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }
        photoUrl: { type: string }
        nutrition:
          $ref: "#/components/schemas/NutritionInput"

    IngestSourceType:
      type: string
      enum: [text, pdf]

    IngestRecipesInput:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/IngestSourceType"
        text:
          type: string
          description: Required when source=text. Raw pasted recipe text.
        fileBase64:
          type: string
          description: Required when source=pdf. Base64-encoded PDF file contents (no data-URL prefix).
        fileName:
          type: string
          description: Optional original file name, used only for error messages.
        pages:
          type: array
          items:
            type: integer
            minimum: 1
          description: >
            Optional, source=pdf only. Restricts extraction to these 1-based page numbers,
            normally the page ranges of recipes the user picked from /recipes/pdf-outline.
            Omit to scan the whole document. Selecting only the pages you want is dramatically
            cheaper and faster: it cuts both the text sent to the model and the number of
            recipes it has to write back.

    PdfRecipeCandidate:
      type: object
      description: >
        One recipe located in a PDF by local heuristics. No AI is involved in producing this —
        it exists so the user can choose what to extract before any model call is made.
      required: [startPage, endPage, title, snippet]
      properties:
        startPage:
          type: integer
          description: 1-based page the recipe starts on.
        endPage:
          type: integer
          description: >
            1-based last page of the recipe, derived from where the next recipe begins.
            Over half the recipes in a typical cookbook span more than one page, so selecting
            a single page would truncate them.
        title:
          type: string
          description: Best-effort title. Heuristic and layout-dependent — always show the page range alongside it.
        snippet:
          type: string
          description: First lines of the recipe, so the user can confirm the match.

    PdfOutlineInput:
      type: object
      required: [fileBase64]
      properties:
        fileBase64:
          type: string
          description: Base64-encoded PDF file contents (no data-URL prefix).
        fileName:
          type: string
          description: Optional original file name, used only for error messages.

    PdfOutlineResult:
      type: object
      required: [pageCount, candidates]
      properties:
        pageCount:
          type: integer
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PdfRecipeCandidate"
          description: Empty when nothing could be detected — the client should fall back to ingesting the whole document.

    IngestedRecipe:
      type: object
      description: A recipe extracted from ingested content, not yet saved.
      required:
        - title
        - description
        - ingredients
        - instructions
        - servings
        - prepMinutes
        - cookMinutes
        - tags
      properties:
        title: { type: string }
        description: { type: ["string", "null"] }
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions: { type: string }
        servings: { type: ["integer", "null"] }
        prepMinutes: { type: ["integer", "null"] }
        cookMinutes: { type: ["integer", "null"] }
        tags:
          type: array
          items: { type: string }
        nutrition:
          oneOf:
            - $ref: "#/components/schemas/NutritionInput"
            - type: "null"
          description: >
            Per-serving nutrition as printed by the source, or null when the source did not
            state it. Never inferred at this stage — an estimate would be indistinguishable
            from a printed panel once stored.

    IngestRecipesResult:
      type: object
      required: [recipes, warnings]
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/IngestedRecipe"
        warnings:
          type: array
          items: { type: string }
          description: Non-fatal notes about the extraction (e.g. truncated input, ambiguous quantities).

    GenerateRecipeInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }

    GeneratedRecipeResult:
      type: object
      required: [recipe, inspiredBy]
      properties:
        recipe:
          $ref: "#/components/schemas/IngestedRecipe"
        inspiredBy:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
          description: Existing recipes from the user's collection that most directly informed this generation, if any.

    GenerateMealPlanInput:
      type: object
      required: [weekStart, prompt, mealSlots]
      properties:
        weekStart: { type: string, format: date, description: "Monday of the target week (YYYY-MM-DD)." }
        prompt: { type: string, minLength: 1 }
        mealSlots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MealSlot"
          description: Which meal slots to plan for, applied across all 7 days of the week.

    GeneratedMealPlanAssignment:
      type: object
      required: [date, mealSlot, existingRecipe, newRecipe, newRecipeKey, note]
      properties:
        date: { type: string, format: date }
        mealSlot:
          $ref: "#/components/schemas/MealSlot"
        existingRecipe:
          oneOf:
            - $ref: "#/components/schemas/RecipeSummary"
            - type: "null"
          description: Set when this slot reuses an existing recipe from the user's collection.
        newRecipe:
          oneOf:
            - $ref: "#/components/schemas/IngestedRecipe"
            - type: "null"
          description: Set when this slot proposes a brand-new recipe not yet saved.
        newRecipeKey:
          type: ["string", "null"]
          description: When multiple slots share the same newRecipeKey, they refer to the SAME proposed new recipe (e.g. a big-batch dinner) — create it once and reuse its id for every slot sharing the key.
        note:
          type: ["string", "null"]

    SkippedMealPlanSlot:
      type: object
      required: [date, mealSlot, reason]
      properties:
        date: { type: string, format: date }
        mealSlot:
          $ref: "#/components/schemas/MealSlot"
        reason: { type: string }

    GeneratedMealPlanResult:
      type: object
      required: [assignments, skippedSlots, notes]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedMealPlanAssignment"
        skippedSlots:
          type: array
          items:
            $ref: "#/components/schemas/SkippedMealPlanSlot"
          description: Requested slots the AI could not confidently fill, with a reason.
        notes:
          type: ["string", "null"]
          description: Optional short overall note about the generated plan.

    RecipeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions: { type: string, minLength: 1 }
        servings: { type: ["integer", "null"], minimum: 1 }
        prepMinutes: { type: ["integer", "null"], minimum: 0 }
        cookMinutes: { type: ["integer", "null"], minimum: 0 }
        tags:
          type: array
          items: { type: string }
        photoUrl: { type: ["string", "null"] }
        nutrition:
          oneOf:
            - $ref: "#/components/schemas/NutritionInput"
            - type: "null"
          description: Setting this marks the values as a manual correction unless `source` says otherwise.

    RecipeSummary:
      type: object
      required: [id, title, photoUrl, servings, prepMinutes, cookMinutes, tags]
      properties:
        id: { type: integer }
        title: { type: string }
        photoUrl: { type: ["string", "null"] }
        servings: { type: ["integer", "null"] }
        prepMinutes: { type: ["integer", "null"] }
        cookMinutes: { type: ["integer", "null"] }
        tags:
          type: array
          items: { type: string }

    MealPlanEntry:
      type: object
      required: [id, date, mealSlot, servings, recipe, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        mealSlot:
          $ref: "#/components/schemas/MealSlot"
        servings: { type: ["integer", "null"] }
        recipe:
          $ref: "#/components/schemas/RecipeSummary"
        createdAt: { type: string, format: date-time }

    MealPlanEntryInput:
      type: object
      required: [date, mealSlot, recipeId]
      properties:
        date: { type: string, format: date }
        mealSlot:
          $ref: "#/components/schemas/MealSlot"
        recipeId: { type: integer }
        servings: { type: integer, minimum: 1 }

    MealPlanEntryUpdate:
      type: object
      properties:
        date: { type: string, format: date }
        mealSlot:
          $ref: "#/components/schemas/MealSlot"
        recipeId: { type: integer }
        servings: { type: ["integer", "null"], minimum: 1 }

    GroceryListItemSource:
      type: string
      enum: [auto, manual]

    GroceryListItemRecipeSource:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }

    GroceryListItem:
      type: object
      required:
        - id
        - weekStart
        - name
        - quantity
        - unit
        - category
        - checked
        - source
        - recipeSources
        - createdAt
      properties:
        id: { type: integer }
        weekStart: { type: string, format: date }
        name: { type: string }
        quantity: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        category:
          $ref: "#/components/schemas/IngredientCategory"
        checked: { type: boolean }
        source:
          $ref: "#/components/schemas/GroceryListItemSource"
        recipeSources:
          type: array
          description: Recipes this item's quantity was aggregated from (empty for manually added items).
          items:
            $ref: "#/components/schemas/GroceryListItemRecipeSource"
        createdAt: { type: string, format: date-time }

    GroceryListItemInput:
      type: object
      required: [weekStart, name, category]
      properties:
        weekStart: { type: string, format: date }
        name: { type: string, minLength: 1 }
        quantity: { type: number }
        unit: { type: string }
        category:
          $ref: "#/components/schemas/IngredientCategory"

    GroceryListItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        quantity: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        category:
          $ref: "#/components/schemas/IngredientCategory"
        checked: { type: boolean }

    GenerateGroceryListInput:
      type: object
      required: [weekStart]
      properties:
        weekStart: { type: string, format: date }

    DashboardSummary:
      type: object
      required:
        - weekStart
        - recipeCount
        - mealsPlannedThisWeek
        - groceryItemCount
        - groceryCheckedCount
        - recentRecipes
        - todayEntries
      properties:
        weekStart: { type: string, format: date }
        recipeCount: { type: integer }
        mealsPlannedThisWeek: { type: integer }
        groceryItemCount: { type: integer }
        groceryCheckedCount: { type: integer }
        recentRecipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
        todayEntries:
          type: array
          items:
            $ref: "#/components/schemas/MealPlanEntry"
